<title>index</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one bilingual app. Website pages use a centred 1200px column; patient and field apps sit in a phone-width column; desk tools use a header + fluid content; the command center is a fixed dark wall layout that stacks on small screens. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface2:#EAF0EE; --ink:#12201C; --muted:#4A5A55; --line:#DDE5E2; --line2:#C5D2CD;
  --brand-bg:#0A6B57; --brand-text:#0A6B57; --brand-ink:#08493C; --brand-soft:#E3F1EC; --on-fill:#FFFFFF;
  --deep:#0B3D33; --deep-card:#134A3F; --on-deep:#FFFFFF; --deep-muted:#C9E3DB; --mint:#9FD9C8;
  --blue-bg:#2A4F80; --blue-text:#2A4F80; --blue-soft:#E8EEF6;
  --amber-text:#7A4F00; --amber-soft:#FDF1D8; --amber-line:#E2B65A;
  --red-bg:#B5481A; --red-text:#8E3A14; --red-soft:#FBEEE7; --red-line:#E3B9A3;
  --purple-bg:#6B4FA0; --purple-text:#5A3F8C; --purple-soft:#F3EFFA;
  --gray-text:#3F4A47; --gray-soft:#ECEFEE;
  --bar-bg:#12201C; --bar-fg:#E6EFEC; --bar-muted:#A9B8B3; --bar-line:#2B3A36;
  --focus:#5FB79F;
  --c-bg:#0C1714; --c-panel:#13221E; --c-line:#22352F; --c-ink:#E6EFEC; --c-muted:#93A8A1; --c-soft:#B9C9C4; --c-green:#3FBF9B; --c-blue:#7FA9E0; --c-amber:#F2B04A; --c-red:#F0706A; --c-row:#1F3530; --c-deep:#0F1C19;
  --font-ar:'IBM Plex Sans Arabic','IBM Plex Sans',Tahoma,'Segoe UI',sans-serif;
  --font-en:'IBM Plex Sans','IBM Plex Sans Arabic','Segoe UI',Helvetica,Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#15201D; --surface2:#1B2925; --ink:#E4EEEA; --muted:#9DB0AA; --line:#25352F; --line2:#34473F;
  --brand-bg:#0E7A63; --brand-text:#6FD3B6; --brand-ink:#A6E6D3; --brand-soft:#16352D; --on-fill:#FFFFFF;
  --deep:#0A2A23; --deep-card:#113A30; --on-deep:#F1F7F5; --deep-muted:#B5D6CC; --mint:#9FD9C8;
  --blue-bg:#3A64A0; --blue-text:#9DB9E8; --blue-soft:#1C2A3F;
  --amber-text:#F2C46B; --amber-soft:#35290F; --amber-line:#7A5A1A;
  --red-bg:#B5481A; --red-text:#F29A78; --red-soft:#3A1E14; --red-line:#6E3420;
  --purple-bg:#7458AD; --purple-text:#C7B3F0; --purple-soft:#2A2140;
  --gray-text:#C5D0CC; --gray-soft:#22302C;
  --bar-bg:#070D0B; --bar-line:#1D2A26;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#15201D; --surface2:#1B2925; --ink:#E4EEEA; --muted:#9DB0AA; --line:#25352F; --line2:#34473F;
  --brand-bg:#0E7A63; --brand-text:#6FD3B6; --brand-ink:#A6E6D3; --brand-soft:#16352D; --on-fill:#FFFFFF;
  --deep:#0A2A23; --deep-card:#113A30; --on-deep:#F1F7F5; --deep-muted:#B5D6CC; --mint:#9FD9C8;
  --blue-bg:#3A64A0; --blue-text:#9DB9E8; --blue-soft:#1C2A3F;
  --amber-text:#F2C46B; --amber-soft:#35290F; --amber-line:#7A5A1A;
  --red-bg:#B5481A; --red-text:#F29A78; --red-soft:#3A1E14; --red-line:#6E3420;
  --purple-bg:#7458AD; --purple-text:#C7B3F0; --purple-soft:#2A2140;
  --gray-text:#C5D0CC; --gray-soft:#22302C;
  --bar-bg:#070D0B; --bar-line:#1D2A26;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font-ar);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:var(--font-en);line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
a{color:var(--brand-text)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%;min-height:48px}
input[type=file]{background:var(--surface2);border-style:dashed}
textarea{resize:vertical}
.ic{flex:none;display:block}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{color:var(--brand-text);font-weight:600;font-size:14px;letter-spacing:.02em}
.h1{font-size:clamp(32px,5vw,52px);font-weight:700}
.h2{font-size:clamp(26px,3.4vw,36px);font-weight:700}
.h3{font-size:20px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-weight:600;text-decoration:none;background:none;line-height:1.2;text-align:center}
.btn-pri{background:var(--brand-bg);color:var(--on-fill)}
.btn-sec{background:var(--surface);color:var(--brand-text);border-color:var(--brand-text)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn-warn{background:var(--surface);color:var(--red-text);border-color:var(--red-line)}
.btn-red{background:var(--red-bg);color:#fff}
.btn-blue{background:var(--blue-bg);color:#fff}
.btn-purple{background:var(--purple-bg);color:#fff}
.btn-block{width:100%}
.btn[disabled]{background:var(--gray-soft);color:var(--muted);border-color:transparent;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:10px 0;color:var(--brand-text);font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0}
.tile strong{font-size:28px;line-height:1.1}
.icobox{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);display:flex;align-items:center;justify-content:center;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-green{background:var(--brand-soft);color:var(--brand-ink)}
.b-amber{background:var(--amber-soft);color:var(--amber-text)}
.b-blue{background:var(--blue-soft);color:var(--blue-text)}
.b-red{background:var(--red-soft);color:var(--red-text)}
.b-gray{background:var(--gray-soft);color:var(--gray-text)}
.b-purple{background:var(--purple-soft);color:var(--purple-text)}
.b-solid{background:var(--brand-bg);color:#fff}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--brand-bg);color:#fff;border-color:var(--brand-bg);font-weight:600}
.choice{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;color:var(--ink);min-height:56px;width:100%}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{background:var(--brand-soft);border:2px solid var(--brand-text)}
.box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
[aria-pressed="true"] .box,[aria-checked="true"] .box{background:var(--brand-bg);border-color:var(--brand-bg);color:#fff}
.radio{border-radius:999px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500;flex:1 1 220px;min-width:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:10px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:15px}
.note-red{background:var(--red-soft);color:var(--red-text)}
.note-green{background:var(--brand-soft);color:var(--brand-ink)}
.note-amber{background:var(--amber-soft);color:var(--amber-text);border:1.5px solid var(--amber-line)}
.note-gray{background:var(--gray-soft);color:var(--gray-text);border:1.5px dashed var(--line2)}
.tablebox{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;text-align:start;font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface2);padding:12px 14px;text-align:start}
td{padding:12px 14px;border-top:1px solid var(--line);text-align:start}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--bar-bg);color:var(--bar-fg);border-radius:12px;padding:12px 16px;z-index:60;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar-bg);color:var(--bar-fg);border-bottom:1px solid var(--bar-line)}
.proto .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-block:8px;max-width:1440px}
.proto a{color:var(--bar-fg);text-decoration:none;font-weight:700;display:flex;gap:8px;align-items:center}
.proto select{width:auto;min-height:40px;background:#1E2C28;color:var(--bar-fg);border-color:#33463F;padding:6px 10px;font-size:14px;max-width:62vw}
.langbtn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-weight:600;font-size:14px}
.proto-tag{font-size:12px;color:var(--bar-muted);font-weight:500}

/* website */
.site-top{background:var(--deep);color:#fff;font-size:14px}
.site-top .wrap{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between;padding-block:8px}
.site-head{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.site-head .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.brand b{font-size:19px;line-height:1.2;display:block}
.brand span{font-size:13px;color:var(--muted);display:block;line-height:1.2}
.mainnav{display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center}
.mainnav button,.mainnav a{background:none;border:0;padding:10px 0;color:var(--ink);text-decoration:none;font-weight:500}
.mainnav [aria-current="page"]{color:var(--brand-text);font-weight:700}
.menubtn{display:none}
@media (max-width: 900px){
  .mainnav{display:none}
  .mainnav.open{display:flex;flex-direction:column;align-items:stretch;position:absolute;inset-inline:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 20px 16px;gap:0}
  .mainnav.open button,.mainnav.open a{padding:14px 0;border-bottom:1px solid var(--line);text-align:start}
  .menubtn{display:inline-flex}
  .head-cta{display:none}
}
.section{padding-block:clamp(48px,7vw,80px)}
.hero{background:var(--surface)}
.hero .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:center;padding-block:clamp(40px,6vw,72px)}
.photo{min-height:340px;border-radius:20px;background:var(--surface2);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--line2)}
.float{position:absolute;bottom:-20px;inset-inline-start:20px;background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:0 12px 32px rgba(18,32,28,.16);display:flex;gap:12px;align-items:center;max-width:320px;border:1px solid var(--line)}
.band{background:var(--deep);color:var(--on-deep)}
.band .eyebrow{color:var(--mint)}
.band .muted{color:var(--deep-muted)}
.dcard{background:var(--deep-card);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.num{width:40px;height:40px;border-radius:999px;background:var(--mint);color:#0B3D33;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.refband{background:var(--blue-soft)}
.tabs{display:flex;gap:6px;background:var(--surface2);border-radius:14px;padding:6px}
.tabs button{flex:1 1 0;border:0;border-radius:10px;min-height:48px;background:transparent;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--brand-text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.site-foot{background:var(--bar-bg);color:#D5DFDC;padding-block:56px 28px}
.site-foot a,.site-foot button{color:#D5DFDC;background:none;border:0;padding:4px 0;text-decoration:none;text-align:start}

/* journey */
.phase{border-radius:20px;padding:clamp(16px,3vw,28px);background:var(--surface2);display:flex;flex-direction:column;gap:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px;counter-reset:none;list-style:none;margin:0;padding:0}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.step .n{font-weight:700;color:var(--brand-text);font-size:14px}
.step.gate{background:var(--purple-soft);border:2px solid var(--purple-bg)}
.step.gate .n,.step.gate .owner{color:var(--purple-text)}
.step.good{background:var(--brand-soft);border-color:var(--brand-text)}
.step.risk{background:var(--red-soft);border-color:var(--red-line)}
.step.risk .n{color:var(--red-text)}
.step .owner{font-size:13px;font-weight:600;color:var(--brand-text);margin-top:auto}
.branch{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.branch.exit{background:var(--surface);border:1.5px dashed var(--line2)}
.branch.loop{background:var(--surface);border:1.5px dashed var(--brand-text)}
.branch.risk{background:var(--red-soft);border:1.5px solid var(--red-line);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:6px}

/* phone apps */
.appwrap{padding:20px 16px 40px;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:clip;display:flex;flex-direction:column;min-height:780px;box-shadow:0 20px 50px rgba(18,32,28,.10)}
.ph-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:8px}
.ph-head.dark{background:var(--bar-bg);color:#fff;border-color:var(--bar-line)}
.ph-body{flex:1 1 auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.ph-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.tabbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar a,.tabbar button{flex:1 1 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:12px;background:none;border:0}
.tabbar [aria-current="page"]{color:var(--brand-text);font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;flex:none}
.ph-head.dark .iconbtn{background:transparent;border-color:transparent;color:#fff}
.hero-card{background:var(--deep);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero-card .sub{color:var(--deep-muted)}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qa a,.qa button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;min-height:104px;text-align:start;font-weight:600}
.progress{height:10px;border-radius:999px;background:var(--brand-soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--brand-bg);border-radius:999px}
.daybtn{flex:1 1 0;min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.daybtn[aria-pressed="true"]{background:var(--brand-bg);border-color:var(--brand-bg);color:#fff}
.seg{display:flex;border-bottom:1px solid var(--line)}
.seg button{flex:1 1 0;min-height:48px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted)}
.seg button[aria-selected="true"]{border-bottom-color:var(--brand-text);color:var(--brand-text);font-weight:700}
.tracker{display:flex;list-style:none;margin:0;padding:0}
.tracker li{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;color:var(--muted)}
.dot{width:28px;height:28px;border-radius:999px;border:2px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center}
.tracker .done .dot{background:var(--brand-bg);border-color:var(--brand-bg);color:#fff}
.tracker .cur{color:var(--brand-text);font-weight:700}
.tracker .cur .dot{border:3px solid var(--brand-bg)}
.tracker .cur .dot::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--brand-bg)}
.sig{height:110px;border-radius:14px;border:1.5px dashed var(--purple-bg);background:var(--surface);color:var(--purple-text);font-weight:600;width:100%}
.sig.done{border-style:solid;border-width:2px;background:var(--purple-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bars{display:flex;gap:6px}
.bars span{flex:1 1 0;height:6px;border-radius:999px;background:var(--line)}
.bars span.on{background:var(--brand-bg)}
.staff-stats{display:flex;gap:8px}
.staff-stats div{flex:1 1 0;background:#22332E;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.staff-stats span{font-size:12px;color:var(--bar-muted)}
.staff-stats strong{font-size:22px;color:#fff}

/* desk tools */
.desk-head{background:var(--surface);border-bottom:1px solid var(--line)}
.desk-head .wrap{max-width:1440px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding-block:12px}
.desknav{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding-bottom:2px}
.desknav a{padding:10px 14px;border-radius:10px;color:var(--ink);text-decoration:none;white-space:nowrap}
.desknav [aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.desk-main{max-width:1280px;margin-inline:auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.cols>*{min-width:0}
.queue button{width:100%;text-align:start;background:var(--surface);border:0;border-inline-start:4px solid transparent;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.queue button[aria-pressed="true"]{background:var(--brand-soft);border-inline-start-color:var(--brand-text)}
.stages{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.stages li{flex:1 1 104px;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35;background:var(--surface2);color:var(--muted);border:1px dashed var(--line2);display:flex;flex-direction:column;gap:2px}
.stages li.done{background:var(--brand-soft);color:var(--brand-ink);border:1px solid transparent;font-weight:600}
.stages li.cur{background:var(--brand-bg);color:#fff;border:1px solid transparent;font-weight:700}
.stages li.stop{background:var(--gray-soft);color:var(--gray-text);text-decoration:line-through;border:1px solid transparent}

/* referrer portal */
.rp{display:flex;flex-wrap:wrap;min-height:calc(100vh - 57px)}
.rp-side{flex:1 1 240px;background:var(--bar-bg);color:#D5DFDC;padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.rp-side nav{display:flex;flex-direction:column;gap:4px}
.rp-side nav a,.rp-side nav button{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;color:#D5DFDC;text-decoration:none;background:none;border:0;text-align:start}
.rp-side nav [aria-current="page"]{background:#22332E;color:#fff;font-weight:600}
.rp-main{flex:999 1 560px;min-width:0;padding:28px 24px 48px;display:flex;flex-direction:column;gap:22px}
@media (max-width: 860px){
  .rp-side{flex-basis:100%;padding:14px}
  .rp-side nav{flex-direction:row;overflow-x:auto}
  .rp-side nav a,.rp-side nav button{white-space:nowrap}
  .rp-user{display:none}
  .rp-main{padding:20px 16px 40px}
}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:flex;gap:14px}
.timeline .rail{display:flex;flex-direction:column;align-items:center}
.timeline .rail i{width:14px;height:14px;border-radius:999px;background:var(--brand-bg);margin-top:5px}
.timeline .rail b{width:2px;flex:1 1 auto;background:var(--line2)}
.timeline .open i{background:var(--surface);border:2px solid var(--brand-bg)}
.msg{background:var(--surface2);border-radius:12px;padding:10px 12px}

/* command center: deliberately dark in both themes */
.cmd{background:var(--c-bg);color:var(--c-ink);min-height:calc(100vh - 57px);padding:20px;display:flex;flex-direction:column;gap:16px}
.cmd .muted{color:var(--c-muted)}
.cmd a{color:#7FD4BA}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--c-panel);border:1px solid var(--c-line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.kpi strong{font-size:34px;line-height:1}
.kpi.alert{background:#2A1715;border-color:#5A2A24}
.cgrid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr) minmax(0,400px);gap:16px;align-items:start}
@media (max-width: 1300px){.cgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cgrid .mapcol{grid-column:1 / -1;order:-1}}
@media (max-width: 760px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.cpanel{background:var(--c-panel);border:1px solid var(--c-line);border-radius:16px;display:flex;flex-direction:column;min-width:0}
.cpanel>header{padding:14px 18px;border-bottom:1px solid var(--c-line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.calert{background:var(--c-deep);border:1px solid var(--c-line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cbtn{min-height:38px;padding:0 14px;border-radius:8px;font-weight:700;font-size:14px;border:1px solid #36504A;background:transparent;color:var(--c-ink)}
.cbtn.go{background:var(--c-green);color:#08231B;border-color:var(--c-green)}
.cmd table th{background:transparent;color:var(--c-muted);font-size:13px}
.cmd table td{border-top:1px solid var(--c-row);color:var(--c-soft)}
.cmd table td.p{color:var(--c-ink);font-weight:600}
.sev{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.sev.crit{background:var(--c-red);color:#1A0B09}
.sev.warn{background:var(--c-amber);color:#1F1503}
.sev.info{background:var(--c-blue);color:#0B1626}
.st-in{color:var(--c-green);font-weight:600}
.st-route{color:var(--c-blue);font-weight:600}
.st-late{color:var(--c-amber);font-weight:600}
.trow{padding:10px 18px;border-bottom:1px solid var(--c-row);display:flex;gap:12px;align-items:center}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid #36504A;white-space:nowrap}
.mapbox{position:relative;border-radius:16px;overflow:hidden;background:var(--c-panel);border:1px solid var(--c-line)}
.mapbox svg{display:block;width:100%;height:auto}

@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media (max-width: 520px){
  .appwrap{padding:0}
  .phone{border-radius:0;border:0;box-shadow:none;min-height:calc(100vh - 57px)}
  .wrap{padding-inline:16px}
  .float{position:static;margin-top:12px;max-width:none}
}

    '<ul class="stack" style="list-style:none;margin:0;padding:0;gap:8px">'+items.map(function(x){ return '<li class="row" style="flex-wrap:nowrap;gap:10px;align-items:flex-start"><span style="color:'+(blue?'var(--blue-text)':'var(--brand-text)')+'">'+ic('check',20,2)+'</span><span>'+tt(x)+'</span></li>'; }).join('')+'</ul>'+

function pageJourney(){
  function step(n, title, desc, owner, cls, link){
    return '<li class="step '+(cls||'')+'"><span class="n tnum">'+n+'</span><strong style="font-size:17px;line-height:1.35">'+tt(title)+'</strong><span class="muted small">'+tt(desc)+'</span><span class="owner">'+tt(owner)+'</span>'+(link?'<a class="linkbtn small" href="#'+link[0]+'">'+tt(link[1])+ic('chev',16)+'</a>':'')+'</li>';
  }

    return '<div class="branch '+cls+'"><span style="color:'+(cls==='risk'?'var(--red-text)':cls==='loop'?'var(--brand-text)':'var(--muted)')+'">'+ic(icon,22)+'</span><span class="stack" style="gap:2px"><strong>'+tt(title)+'</strong><span class="small muted">'+tt(text)+'</span>'+(link?'<a class="linkbtn small" href="#'+link[0]+'">'+tt(link[1])+ic('chev',16)+'</a>':'')+'</span></div>';
  }
  var V = ['اعرض الواجهة','Open the screen'];
  return siteHeader()+'<main class="section" style="padding-top:40px"><div class="wrap stack" style="gap:28px">'+
    '<div class="stack" style="gap:10px;max-width:760px"><span class="eyebrow">'+t('رحلة المريض','Patient journey')+'</span><h1 class="h1" style="font-size:clamp(30px,4.4vw,46px)">'+t('من الإحالة إلى التعافي — بكل المسارات','From referral to recovery — every path')+'</h1><p class="muted" style="font-size:18px">'+t('13 خطوة في ثلاث مراحل، مع الخروج من المسار، والحلقات، والتصعيد، والطوارئ، والعودة. كل خطوة مرتبطة بالواجهة التي تُنفّذ فيها.','13 steps in three phases, including exits, loops, escalation, emergencies and return. Each step links to the screen where it happens.')+'</p></div>'+
    '<div class="legend"><span><i class="sw" style="background:var(--purple-soft);border:2px solid var(--purple-bg)"></i>'+t('بوابة إلزامية','Mandatory gateway')+'</span><span><i class="sw" style="border:1.5px dashed var(--line2)"></i>'+t('خروج من المسار','Exit from pathway')+'</span><span><i class="sw" style="border:1.5px dashed var(--brand-text)"></i>'+t('حلقة عودة','Loop back')+'</span><span><i class="sw" style="background:var(--red-soft);border:1.5px solid var(--red-line)"></i>'+t('تصعيد وطوارئ ونقل','Escalation, emergency, transfer')+'</span><span><i class="sw" style="background:var(--brand-soft);border:1.5px solid var(--brand-text)"></i>'+t('التعافي والخروج','Recovery & discharge')+'</span></div>'+

    '<section class="phase" aria-labelledby="ph1"><div class="row between"><h2 id="ph1" class="h3">'+t('المرحلة 1 · الدخول والقبول','Phase 1 · Intake & approval')+'</h2><span class="badge b-amber">'+t('الخطوات 1–7','Steps 1–7')+'</span></div><ol class="steps">'+
      step('1',['الإحالة أو الطلب','Referral / request'],['إحالة من مستشفى أو طلب مباشر، مع تأكيد الاستلام','Hospital referral or direct request; receipt confirmed'],['منسّق الرعاية · [المدة]','Care coordinator · [SLA]'],'',['d-inbox',V])+
      step('2',['تقييم الأهلية','Eligibility assessment'],['التشخيص واستقرار الحالة وملاءمة المنزل','Diagnosis, stability and home suitability'],['الطبيب · [المدة]','Physician · [SLA]'],'',['d-review',V])+
      step('3',['اعتماد اللجنة الطبية','Medical committee'],['مراجعة سريرية واعتماد الرعاية في المنزل','Clinical review and approval'],['اللجنة الطبية · [المدة]','Medical committee · [SLA]'],'',['d-review',V])+
      step('4',['التعريف بالخدمة','Service introduction'],['نموذج الرعاية والخطة والمسؤوليات والمدة','Care model, plan, responsibilities, duration'],['منسّق الرعاية','Care coordinator'],'',['p-consent',V])+
      step('5',['الموافقة المستنيرة','Informed consent'],['توقيع المريض أو ممثله، وتشمل مشاركة البيانات','Patient or representative signs, incl. data sharing'],['بوابة إلزامية · لا تبدأ الرعاية دونها','Mandatory gateway · no care without it'],'gate',['p-consent',V])+

  var root = document.documentElement; root.lang = S.lang; root.dir = rtl() ? 'rtl' : 'ltr';
  var info = routeInfo(S.route);
  document.title = 'index';
  var html = (info && info[2] !== 'site' ? protoBar() : '') + VIEWS[S.route]();
  var app = document.getElementById('app'); app.innerHTML = html;
  app.querySelectorAll('[data-keep]').forEach(function(el){ if (S.f[el.id] != null) el.value = S.f[el.id]; });
}
function go(r, scrollId){
  S.menu = false;
  if (location.hash !== '#'+r) { S._scroll = scrollId || null; location.hash = r; }
  else { S.route = r; render(); if (scrollId) scrollToId(scrollId); }
}
function scrollToId(id){ var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }
function fromHash(){
  var h = (location.hash || '').replace('#','');
  if (VIEWS[h]) { S.route = h; S.menu = false; render(); if (S._scroll) { var s = S._scroll; S._scroll = null; setTimeout(function(){ scrollToId(s); }, 30); } else window.scrollTo(0,0); }
  else if (!h) { S.route = 'home'; render(); }
}

  lang: function(){ S.lang = rtl() ? 'en' : 'ar'; try { localStorage.setItem('tabhome-lang', S.lang); } catch(e) {} },
