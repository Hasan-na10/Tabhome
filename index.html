*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--pri);text-decoration:none}a:hover{color:var(--pri-d)}
button{font-family:inherit;cursor:pointer}
input{font-size:16px}
:focus-visible{outline:3px solid #1597A8;outline-offset:2px}
/* layout: phone frame on large screens, full screen on phones */
#stage{min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;gap:28px;padding:28px 20px}
#menu{width:260px;flex:none;position:sticky;top:28px;max-height:calc(100vh - 56px);overflow:auto;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
#menu .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink)}
#menu .grp{display:flex;flex-direction:column;gap:2px}
#menu .gt{font-size:13px;font-weight:700;color:var(--muted);padding:4px 8px}
#menu a{display:flex;align-items:center;min-height:40px;padding:6px 10px;border-radius:10px;color:var(--ink);font-size:15px}
#menu a[aria-current="page"]{background:var(--soft);color:var(--pri);font-weight:700}
#menu .langs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#menu .langs button,#menu .modes button{min-height:40px;border-radius:999px;border:2px solid var(--pri);background:var(--surf);color:var(--pri);font-weight:700;font-size:14px}
#menu .langs button[aria-pressed="true"],#menu .modes button[aria-pressed="true"]{background:var(--pri);color:#fff}
#menu .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#menu .pals{display:grid;grid-template-columns:1fr;gap:6px}
#menu .pals button{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-size:14px;font-weight:600;text-align:start}
#menu .pals button[aria-pressed="true"]{border-color:var(--pri);background:var(--soft)}
#menu .dots{display:inline-flex;flex:none}#menu .dots i{width:18px;height:18px;border-radius:999px;border:2px solid var(--surf);display:block}#menu .dots i+i{margin-inline-start:-6px}
#menu .note{font-size:12.5px;color:var(--muted);line-height:1.6}
#device{flex:none;width:390px;height:844px;border-radius:40px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #0B1220,0 30px 60px rgba(20,35,63,.25);position:relative}
#device.fill{width:auto;flex:1 1 auto;max-width:1400px;height:auto;min-height:calc(100vh - 56px);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 20px 40px rgba(0,0,0,.12)}
#screen>div{max-width:100%}
#device.fill #screen>div{min-height:calc(100vh - 56px)!important}
#menuBtn{display:none}
@media (max-width:900px){
  #menu{position:fixed;inset:0 auto 0 0;z-index:50;width:min(300px,85vw);max-height:none;top:0;border-radius:0;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  [dir="rtl"] #menu{inset:0 0 0 auto;transform:translateX(105%)}
  #menu.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(10,20,40,.35);z-index:49}
  #menuBtn{display:flex;position:fixed;z-index:40;top:42%;inset-inline-end:0;width:24px;height:72px;border:0;border-start-start-radius:12px;border-end-start-radius:12px;background:var(--pri);color:#fff;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(20,41,79,.3);padding:0;opacity:.92}
  #menuBtn svg{width:16px;height:16px}
}
@media (max-width:520px){
  #stage{padding:0;display:block}
  #device{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  #device.fill{min-height:100vh;border-radius:0;box-shadow:none}
  #screen>div{width:100%!important;height:100%!important;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #device.fill #screen>div{height:auto!important;min-height:100vh!important}
  #screen{height:100%}
}
#screen{height:100%}
#device:not(.fill) #screen>div{height:100%!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>

  html += '<p class="note">' + (ar ? 'نموذج تفاعلي ببيانات تجريبية. يعمل دون إنترنت.' : 'Interactive prototype with sample data. Works offline.') + '</p>';
  var m = document.getElementById('menu'); m.innerHTML = html; m.setAttribute('aria-label', ar ? 'الشاشات' : 'Screens');
  document.getElementById('menuBtn').setAttribute('aria-label', ar ? 'كل الشاشات' : 'All screens');
}
function openMenu() { document.getElementById('menu').classList.add('open'); if (!document.getElementById('scrim')) { var s = document.createElement('div'); s.id = 'scrim'; s.addEventListener('click', closeMenu); document.body.appendChild(s); } }
function closeMenu() { document.getElementById('menu').classList.remove('open'); var s = document.getElementById('scrim'); if (s) s.remove(); }

document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('[data-go]');
  if (a) { e.preventDefault(); show(a.getAttribute('data-go'), true); return; }
  var pm = e.target.closest && e.target.closest('#menu [data-pal]');
  if (pm) { THEME.pal = pm.getAttribute('data-pal'); applyTheme(); buildMenu(); return; }
  var md = e.target.closest && e.target.closest('#menu [data-mode]');
  if (md) { THEME.mode = md.getAttribute('data-mode'); applyTheme(); buildMenu(); return; }
  var l = e.target.closest && e.target.closest('[data-lang]');
  if (l) { show(inLang(baseOf(current.name), l.getAttribute('data-lang')), true); return; }
  var href = e.target.closest && e.target.closest('a[href="#"]');
  if (href) e.preventDefault();
});
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
window.addEventListener('popstate', function () { show(location.hash.slice(1) || 'Main', false); });

var start = location.hash.slice(1);
if (!DATA[start]) { var saved = null; try { saved = localStorage.getItem('tabhome-app-lang'); } catch (e) {} start = saved === 'en' ? 'MainEn' : 'Main'; }
show(start, false);
})();
</script>
</body>
</html>
